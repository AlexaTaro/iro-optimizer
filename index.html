<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jiro Voice Optimizer v5.0</title>

    <meta property="og:title" content="Jiro Global Speaker - 二郎コール生成器">
    <meta property="og:description" content="外国人でも二郎でコールを成功させるための、発音特化型デバッグツール。">
    <meta property="og:image" content="https://upload.wikimedia.org/wikipedia/commons/thumb/d/d4/Ramen_Jiro_Mita_Main_Store.jpg/640px-Ramen_Jiro_Mita_Main_Store.jpg">
    <meta name="twitter:card" content="summary_large_image">

    <style>
        :root { --jiro-yellow: #fff100; --bg: #000; --accent: #ff0000; }
        body { font-family: 'Arial Black', sans-serif; background: var(--bg); color: #fff; margin: 0; padding: 10px; display: flex; justify-content: center; }
        .app { width: 100%; max-width: 400px; border: 4px solid var(--jiro-yellow); background: #111; padding: 15px; box-sizing: border-box; }
        
        /* 言語切替 */
        .lang-nav { display: flex; gap: 4px; margin-bottom: 15px; }
        .lang-nav button { flex: 1; padding: 12px; background: #333; color: #fff; border: 1px solid #555; cursor: pointer; font-size: 14px; font-weight: bold; }
        .lang-nav button.active { background: var(--jiro-yellow); color: #000; border-color: var(--jiro-yellow); }

        .instruction { font-size: 0.85rem; color: var(--jiro-yellow); text-align: center; margin-bottom: 15px; min-height: 2.5em; line-height: 1.3; }
        
        .row { margin-bottom: 12px; }
        label { display: block; font-size: 0.75rem; color: #aaa; margin-bottom: 4px; }
        select { width: 100%; padding: 12px; background: #222; color: #fff; border: 1px solid var(--jiro-yellow); font-size: 1rem; border-radius: 0; }

        #exec { width: 100%; padding: 20px; background: var(--jiro-yellow); border: none; font-weight: 900; font-size: 1.3rem; margin: 15px 0; cursor: pointer; }
        
        /* 出力エリア：ここが肝 */
        .output { background: #000; border: 3px solid var(--accent); padding: 25px 10px; text-align: center; position: relative; }
        .output::before { content: "OUTSIDE INTERFACE"; position: absolute; top: -10px; left: 10px; background: var(--accent); color: #fff; font-size: 0.6rem; padding: 2px 5px; }
        
        .main-call { font-size: 2.8rem; font-weight: 900; color: var(--jiro-yellow); line-height: 1.1; margin-bottom: 10px; }
        .reading-call { font-size: 1.5rem; color: #fff; letter-spacing: 1px; border-top: 1px solid #333; padding-top: 10px; }
        
        .meaning { font-size: 0.8rem; color: #666; margin-top: 15px; font-style: italic; }
    </style>
</head>
<body>

<div class="app">
    <div class="lang-nav">
        <button id="btn-ja" class="active" onclick="setL('ja',this)">JP</button>
        <button id="btn-en" onclick="setL('en',this)">EN</button>
        <button id="btn-zh" onclick="setL('zh',this)">ZH</button>
    </div>

    <div id="inst" class="instruction">店員に「ニンニク入れますか？」と聞かれたら、下の黄色い文字を叫んでください。</div>

    <div class="row">
        <label id="lg">ニンニク / Garlic</label>
        <select id="g">
            <option value="" data-y="" data-m="None">なし / None</option>
            <option value="ニンニク" data-y="NINNIKU" data-m="Add Garlic">あり / Add</option>
            <option value="ニンニクマシマシ" data-y="NINNIKU MASHI-MASHI" data-m="Extra Garlic">マシマシ / Double Extra</option>
        </select>
    </div>

    <div class="row">
        <label id="lv">ヤサイ / Vegetable</label>
        <select id="v">
            <option value=" " data-y=" " data-m="Normal">普通 / Normal</option>
            <option value="ヤサイ" data-y="YASAI" data-m="Extra Veggie">増し / Extra</option>
            <option value="ヤサイマシマシ" data-y="YASAI MASHI-MASHI" data-m="Double Extra Veggie">マシマシ / Double Extra</option>
            <option value="ヤサイ少なめ" data-y="YASAI SUKUNAME" data-m="Less Veggie">少なめ / Less</option>
        </select>
    </div>

    <div class="row">
        <label id="lf">アブラ / Fat</label>
        <select id="f">
            <option value=" " data-y=" " data-m="Normal">普通 / Normal</option>
            <option value="アブラ" data-y="ABURA" data-m="Extra Fat">増し / Extra</option>
            <option value="アブラ抜き" data-y="ABURA NUKI" data-m="No Fat">抜き / None</option>
        </select>
    </div>

    <button id="exec" onclick="gen()">GENERATE CALL</button>

    <div class="output">
        <div id="out1" class="main-call">-</div>
        <div id="out2" class="reading-call">-</div>
        <div id="out-m" class="meaning">Selected: None</div>
    </div>
</div>

<script>
let cur = 'ja';
const d = {
    ja: { inst: "店員に「ニンニク入れますか？」と聞かれたら、下の黄色い文字を叫んでください。", b: "コールを生成", g: "ニンニク", v: "ヤサイ", f: "アブラ" },
    en: { inst: "When the staff asks 'Ninniku iremasuka?', SHOUT the yellow text below!", b: "GENERATE COMMAND", g: "Garlic", v: "Vegetable", f: "Pork Fat" },
    zh: { inst: "当主人问 “Ninniku iremasuka?” 时、请大声朗读下方的黄色文字！", b: "生成指令", g: "大蒜", v: "蔬菜", f: "猪油" }
};

function setL(l, b) {
    cur = l;
    document.querySelectorAll('.lang-nav button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    document.getElementById('inst').innerText = d[l].inst;
    document.getElementById('exec').innerText = d[l].b;
    document.getElementById('lg').innerText = d[l].g;
    document.getElementById('lv').innerText = d[l].v;
    document.getElementById('lf').innerText = d[l].f;
}

function gen() {
    const gE = document.getElementById('g');
    const vE = document.getElementById('v');
    const fE = document.getElementById('f');
    
    const isMashi = (gE.value==="ニンニク" && vE.value==="ヤサイ" && fE.value==="アブラ");
    
    let res = "";
    let yomi = "";
    let mean = "";

    if (isMashi) {
        res = "全マシ！";
        yomi = "ZEN-MASHI!";
        mean = (cur==='zh') ? "全部添加" : "All Toppings";
    } else {
        res = [gE.value, vE.value, fE.value].filter(x=>x.trim()).join(" ") + "！";
        yomi = [gE.options[gE.selectedIndex].getAttribute('data-y'), 
                vE.options[vE.selectedIndex].getAttribute('data-y'), 
                fE.options[fE.selectedIndex].getAttribute('data-y')].filter(x=>x.trim()).join(" ");
        mean = [gE.options[gE.selectedIndex].getAttribute('data-m'), 
                vE.options[vE.selectedIndex].getAttribute('data-m'), 
                fE.options[fE.selectedIndex].getAttribute('data-m')].filter(x=>x!=="Normal" && x!=="None").join(", ");
    }

    if (!res || res === "！") {
        res = "そのままで！";
        yomi = "SONO-MAMA-DE!";
        mean = "Default";
    }

    document.getElementById('out1').innerText = res;
    document.getElementById('out2').innerText = yomi;
    document.getElementById('out-m').innerText = "Selected: " + (mean || "Normal");
}
</script>
</body>
</html>

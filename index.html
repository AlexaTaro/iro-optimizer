<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- This tool has moved to lrappli.com. GitHub Pages is static and cannot send
     a real 301, so this is the strongest signal available: canonical tells
     search engines which URL is the original, meta refresh moves visitors who
     have JS disabled, and location.replace keeps the old URL out of the back
     button for everyone else. -->
<link rel="canonical" href="https://lrappli.com/ramen-call.html">
<meta http-equiv="refresh" content="0; url=https://lrappli.com/ramen-call.html">
<meta name="robots" content="noindex, follow">

<title>移転しました — ラーメンコールメーカー</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    background: #fafafa;
    color: #222;
    display: grid;
    place-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 24px;
    box-sizing: border-box;
    line-height: 1.7;
  }
  .box { max-width: 460px; text-align: center; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  p { color: #555; font-size: 15px; margin: 0 0 24px; }
  .en { font-size: 13px; color: #888; }
  a.go {
    display: inline-block;
    padding: 12px 26px;
    border-radius: 999px;
    background: #ed8b00;
    color: #fff;
    font-weight: 700;
    text-decoration: none;
  }
</style>
</head>
<body>
  <div class="box">
    <h1>ページを移転しました</h1>
    <p>
      ラーメンコールメーカーは lrappli.com に移りました。<br>
      自動で移動します。切り替わらない場合は下のボタンからどうぞ。
    </p>
    <p><a class="go" href="https://lrappli.com/ramen-call.html">新しいページへ</a></p>
    <p class="en">This tool has moved to <a href="https://lrappli.com/ramen-call.html">lrappli.com/ramen-call.html</a>.</p>
  </div>
  <script>
    // replace() rather than href: the old URL should not sit in history and
    // bounce anyone who presses Back.
    location.replace('https://lrappli.com/ramen-call.html');
  </script>
</body>
</html>

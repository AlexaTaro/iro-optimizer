<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jiro Global Speaker v4.0</title>
    <style>
        :root { --jiro-yellow: #fff100; --bg-dark: #111; --accent: #ff4500; }
        body { font-family: sans-serif; background: #000; color: #fff; margin: 0; display: flex; justify-content: center; padding: 10px; }
        .app { width: 100%; max-width: 400px; border: 3px solid var(--jiro-yellow); background: var(--bg-dark); padding: 15px; box-sizing: border-box; }
        .lang-nav { display: flex; gap: 5px; margin-bottom: 20px; }
        .lang-nav button { flex: 1; padding: 10px; background: #333; color: #fff; border: 1px solid #555; cursor: pointer; font-size: 12px; }
        .lang-nav button.active { background: var(--jiro-yellow); color: #000; font-weight: bold; }
        h1 { font-size: 0.9rem; color: var(--jiro-yellow); text-align: center; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .row { margin-bottom: 15px; }
        label { display: block; font-size: 0.8rem; color: var(--jiro-yellow); margin-bottom: 5px; }
        select { width: 100%; padding: 12px; background: #222; color: #fff; border: 1px solid #444; font-size: 1rem; }
        #exec { width: 100%; padding: 20px; background: var(--jiro-yellow); border: none; font-weight: bold; font-size: 1.2rem; margin: 15px 0; cursor: pointer; }
        .output { background: #000; border: 2px solid var(--accent); padding: 20px; text-align: center; }
        .main-call { font-size: 2.2rem; font-weight: 900; color: var(--jiro-yellow); line-height: 1.2; word-break: break-all; }
        .sub-call { font-size: 1.1rem; color: #ccc; margin-top: 10px; letter-spacing: 2px; }
        .hint { font-size: 0.7rem; color: #888; margin-top: 15px; }
    </style>
</head>
<body>

<div class="app">
    <div class="lang-nav">
        <button class="active" onclick="setL('ja',this)">JP</button>
        <button onclick="setL('en',this)">EN</button>
        <button onclick="setL('zh',this)">ZH</button>
    </div>

    <h1 id="t">JIRO CALL GENERATOR</h1>

    <div class="row">
        <label id="lg">ニンニク / Garlic</label>
        <select id="g">
            <option value="" data-y="">なし / None</option>
            <option value="ニンニク" data-y="NINNIKU">あり / Add</option>
            <option value="ニンニクマシマシ" data-y="NINNIKU MASHI-MASHI">マシマシ / Extra</option>
        </select>
    </div>

    <div class="row">
        <label id="lv">ヤサイ / Vegetable</label>
        <select id="v">
            <option value=" " data-y=" ">普通 / Normal</option>
            <option value="ヤサイ" data-y="YASAI">増し / Extra</option>
            <option value="ヤサイマシマシ" data-y="YASAI MASHI-MASHI">マシマシ / Extra</option>
            <option value="ヤサイ少なめ" data-y="YASAI SUKUNAME">少なめ / Less</option>
        </select>
    </div>

    <div class="row">
        <label id="lf">アブラ / Fat</label>
        <select id="f">
            <option value=" " data-y=" ">普通 / Normal</option>
            <option value="アブラ" data-y="ABURA">増し / Extra</option>
            <option value="アブラ抜き" data-y="ABURA NUKI">抜き / None</option>
        </select>
    </div>

    <button id="exec" onclick="gen()">GENERATE CALL</button>

    <div class="output">
        <div id="out1" class="main-call">-</div>
        <div id="out2" class="sub-call">-</div>
        <div class="hint" id="h">Say this to the staff loudly.</div>
    </div>
</div>

<script>
let cur = 'ja';
const d = {
    ja: { t:"二郎コール生成", b:"コールを生成", g:"ニンニク", v:"ヤサイ", f:"アブラ", h:"これを店員に伝えてください" },
    en: { t:"JIRO CALL SPEAKER", b:"GENERATE CALL", g:"Garlic", v:"Vegetable", f:"Pork Fat", h:"Read the yellow text loudly to staff!" },
    zh: { t:"二郎拉面点餐助手", b:"生成口令", g:"大蒜", v:"蔬菜", f:"猪油", h:"请对着店员大声朗読黄色文字" }
};

function setL(l, b) {
    cur = l;
    document.querySelectorAll('.lang-nav button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    document.getElementById('t').innerText = d[l].t;
    document.getElementById('exec').innerText = d[l].b;
    document.getElementById('lg').innerText = d[l].g;
    document.getElementById('lv').innerText = d[l].v;
    document.getElementById('lf').innerText = d[l].f;
    document.getElementById('h').innerText = d[l].h;
}

function gen() {
    const gE = document.getElementById('g');
    const vE = document.getElementById('v');
    const fE = document.getElementById('f');
    
    // 全マシ判定
    const isMashi = (gE.value==="ニンニク" && vE.value==="ヤサイ" && fE.value==="アブラ");
    
    let res = "";
    let yomi = "";

    if (isMashi) {
        res = "全マシ！";
        yomi = "ZEN-MASHI!";
    } else {
        res = [gE.value, vE.value, fE.value].filter(x=>x.trim()).join("") + "！";
        yomi = [gE.options[gE.selectedIndex].getAttribute('data-y'), 
                vE.options[vE.selectedIndex].getAttribute('data-y'), 
                fE.options[fE.selectedIndex].getAttribute('data-y')].filter(x=>x.trim()).join(" ");
    }

    if (res === "！") {
        res = "そのままで！";
        yomi = "SONO-MAMA-DE!";
    }

    document.getElementById('out1').innerText = res;
    document.getElementById('out2').innerText = yomi;
}
</script>
</body>
</html>
